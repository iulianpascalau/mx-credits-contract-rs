source ./config.cfg

function continue-confirmation {
  FUNC="$1"
  echo -e
  read -p "Enter any key to continue with "${FUNC}"" yn
  echo -e

  ${FUNC}
}

function pause {
    mxpy contract call "${CONTRACT_ADDRESS}" --recall-nonce "${MXPY_SIGN[@]}" \
        --gas-limit=3000000 --function="pause" \
        --send --proxy="${PROXY}" --chain="${CHAIN_ID}"
}

function migrate {
    mxpy contract call "${CONTRACT_ADDRESS}" --recall-nonce "${MXPY_SIGN[@]}" \
        --gas-limit=100000000 --function="migrate" \
        --arguments "${MIGRATION_START_INDEX}" "${MIGRATION_END_INDEX}"\
        --send --proxy="${PROXY}" --chain="${CHAIN_ID}"
}
